# Chat reference. Replace placeholder resource IDs in an explicit environment.
name = "akamata-chat"
main = "worker/index.mjs"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "akamata-chat"
database_id = "00000000-0000-0000-0000-000000000000"

[[services]]
binding = "AKAMATA_REALTIME_HANDLER"
service = "akamata-chat"
entrypoint = "AkamataRealtimeApplication"

[[durable_objects.bindings]]
name = "AKAMATA_REALTIME"
class_name = "AkamataRealtimeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AkamataRealtimeRoom"]
