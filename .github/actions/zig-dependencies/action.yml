name: Pinned Zig dependency sources
description: Cache immutable package sources, never compiler outputs or test verdicts
runs:
  using: composite
  steps:
    - name: Share source packages with generated projects and worktrees
      shell: bash
      run: echo "ZIG_LOCAL_PKG_DIR=$GITHUB_WORKSPACE/zig-pkg" >> "$GITHUB_ENV"
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      id: sources
      with:
        path: |
          zig-pkg/translate_c-*
          zig-pkg/aro-*
        key: zig-sources-${{ runner.os }}-0.17.0-v1-${{ hashFiles('build.zig.zon') }}
    - name: Fetch exact source pins (bounded network retries only)
      if: steps.sources.outputs.cache-hit != 'true'
      shell: bash
      run: zig run tools/ci/prepare_dependencies.zig -- "$(command -v zig)"
