name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.job.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: native-test
            cmd: zig build test
          - name: native-release-safe
            cmd: zig build test -Doptimize=ReleaseSafe
          - name: native-openssl
            cmd: zig build test -Dopenssl=true -Doptimize=ReleaseSafe
          - name: native-integration
            cmd: zig build integration transport-contract-test runtime-poc-test
          - name: linux threaded + epoll contract
            cmd: zig build transport-contract-test runtime-poc-test runtime-stress-test runtime-isolation-test runtime-session-test -Doptimize=ReleaseSafe
          - name: tasks-test
            cmd: zig build tasks-test
          - name: cli-build
            cmd: zig build cli
          - name: package-archive
            cmd: env ZIG_GLOBAL_CACHE_DIR=/tmp/akamata-package-cache zig fetch .
          - name: chat-native
            cmd: zig build -Dexample=chat
          - name: chat-workers
            cmd: zig build -Dexample=chat -Dbackend=workers -Doptimize=ReleaseSmall
          - name: device-messaging-native
            cmd: zig build -Dexample=device_messaging -Doptimize=ReleaseSafe
          - name: device-messaging-workers
            cmd: zig build -Dexample=device_messaging -Dbackend=workers -Doptimize=ReleaseSafe
          - name: guestbook-workers
            cmd: zig build -Dexample=guestbook -Dbackend=workers -Doptimize=ReleaseSmall
          - name: portable-application-workers
            cmd: zig build portable-application-test -Dbackend=workers -Doptimize=ReleaseSafe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - run: ${{ matrix.job.cmd }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.job.name == 'linux threaded + epoll contract'
        with:
          name: runtime-stress-linux
          path: |
            .zig-cache/runtime-stress.json
            .zig-cache/runtime-application-isolation.json
            .zig-cache/runtime-session-validation.json
          if-no-files-found: ignore

  macos-native:
    name: macos native + kqueue contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - run: zig build test
      - run: zig build -Dexample=bench
      - run: zig build transport-contract-test runtime-poc-test runtime-stress-test runtime-isolation-test runtime-session-test -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-stress-macos
          path: |
            .zig-cache/runtime-stress.json
            .zig-cache/runtime-application-isolation.json
            .zig-cache/runtime-session-validation.json
          if-no-files-found: ignore

  cli-smoke:
    name: cli init smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - run: zig build cli
      - run: zig build cli-operations-test
      - run: zig build cli-capabilities-test compile-fail-test workers-realtime-test workers-wasm-dispatch-test
      - run: zig build scaffold-local-test
      - run: zig build project-update-test
      - run: zig build workers-capability-sync-test
      - run: |
          mkdir -p /tmp/cli-smoke && cd /tmp/cli-smoke
          ${GITHUB_WORKSPACE}/zig-out/bin/akamata init testapp --target=both
          test -f testapp/src/main.zig
          test -f testapp/deploy/wrangler.toml
          test -f testapp/deploy/Dockerfile

  docker-build:
    name: docker-build (chat container)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - run: zig build -Dexample=chat -Dtarget=x86_64-linux-musl -Doptimize=ReleaseFast
      - run: docker build -f deploy/Dockerfile -t akamata-chat .

  http-fuzz:
    name: adversarial HTTP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - run: zig build -Dexample=bench -Doptimize=ReleaseSafe
      - run: |
          ./zig-out/bin/bench >/tmp/akamata-fuzz-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/fuzz/http_fuzz.mjs http://127.0.0.1:8080 --duration=5s --workers=4
