name: Native runtime cost investigation
on:
  workflow_dispatch:
jobs:
  investigate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - name: Install pinned benchmark client
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            asset=oha-linux-amd64
            checksum=86ab7fa2c1df23b3bbc53b73561ffa44a7a38ca08f0e10351df9522a5c4c3c61
          elif [[ "$(uname -m)" == arm64 ]]; then
            asset=oha-macos-arm64
            checksum=70d7cb7c15ed3d5eb4b7d9a7e76f0a8ee32ba1f18f560acef3b28e8670b89bb0
          else
            asset=oha-macos-amd64
            checksum=fc8ccb4126737aae85cc9fbc6f95b161bf8bbb676bf02d4bb6196ec02c709c36
          fi
          curl -fLsS "https://github.com/hatoo/oha/releases/download/v1.15.0/$asset" -o "$RUNNER_TEMP/oha"
          echo "$checksum  $RUNNER_TEMP/oha" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/oha"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build uninstrumented benchmark
        run: |
          git worktree add --detach before-runtime 97f04ac
          (cd before-runtime && ./third_party/sqlite/fetch.sh && zig build -Dexample=bench -Doptimize=ReleaseFast --prefix ../baseline && zig build runtime-reactor-bench -Doptimize=ReleaseFast --prefix ../baseline)
          zig build -Dexample=bench -Doptimize=ReleaseFast --prefix candidate
          zig build runtime-reactor-bench -Doptimize=ReleaseFast --prefix candidate
      - name: Uninstrumented matrix
        run: python3 tools/bench/runtime_matrix.py threaded-before=baseline/bin/bench threaded=candidate/bin/bench before=baseline/bin/runtime-reactor-bench reactor=candidate/bin/runtime-reactor-bench --output certification/uninstrumented.json --connections 4 32 128 256 --rounds 2 --duration 3s --stats --skip-idle
      - name: Build attribution benchmark
        run: |
          zig build -Dexample=bench -Doptimize=ReleaseFast -Druntime-cost=true --prefix measured
          zig build runtime-reactor-bench -Doptimize=ReleaseFast -Druntime-cost=true --prefix measured
      - name: Instrumented matrix (not throughput evidence)
        run: python3 tools/bench/runtime_matrix.py threaded=measured/bin/bench reactor=measured/bin/runtime-reactor-bench --output certification/cost.json --connections 4 32 128 256 --rounds 1 --duration 2s --stats --skip-idle
      - name: Sampling evidence
        run: python3 tools/bench/runtime_profile.py threaded=candidate/bin/bench reactor=candidate/bin/runtime-reactor-bench --output-dir certification/profile --endpoint hello --connections 32 128
      - name: Linux syscall aggregation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
          for endpoint in hello echo db/1; do
            safe=$(echo "$endpoint" | tr / -)
            python3 tools/bench/runtime_syscalls.py candidate/bin/bench --endpoint "$endpoint" --output-dir "certification/syscalls-threaded-$safe"
            python3 tools/bench/runtime_syscalls.py baseline/bin/runtime-reactor-bench --endpoint "$endpoint" --output-dir "certification/syscalls-before-$safe"
            python3 tools/bench/runtime_syscalls.py candidate/bin/runtime-reactor-bench --endpoint "$endpoint" --output-dir "certification/syscalls-reactor-$safe"
          done
      - name: Session memory, mixed workload and races
        run: |
          zig build runtime-certify-fixture -Doptimize=ReleaseSafe --prefix fixture
          python3 tools/bench/runtime_certify.py fixture/bin/runtime-contract-server --adapters threaded --output certification/sessions-threaded.json --idle-levels 1000 --mixed-idle 100 --soak-seconds 30
          if [[ "$RUNNER_OS" == Linux ]]; then adapter=epoll; else adapter=kqueue; fi
          python3 tools/bench/runtime_certify.py fixture/bin/runtime-contract-server --adapters "$adapter" --output certification/sessions-reactor.json --idle-levels 1000 5000 --mixed-idle 1000 --soak-seconds 240
      - name: Full regression prerequisites
        run: zig build transport-contract-test runtime-contract-unit runtime-isolation-test runtime-session-test runtime-stress-test -Doptimize=ReleaseSafe
      - name: Record source and environment
        if: always()
        run: |
          mkdir -p certification
          git rev-parse HEAD > certification/source-sha.txt
          uname -a > certification/environment.txt
          zig version >> certification/environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: investigation-${{ matrix.os }}
          path: certification/
          if-no-files-found: error
